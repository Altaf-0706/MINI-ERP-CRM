services:
  - type: web
    name: minierp-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm run render-postbuild
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minierp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: minierp-db
    plan: free
